name: Build

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

# softprops/action-gh-release needs contents:write to create the draft.
# New GitHub repos default GITHUB_TOKEN to read-only since Feb 2023.
permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest    # Apple Silicon runner (arm64)
            label: macos-arm64
            rust-target: aarch64-apple-darwin
          - platform: windows-latest
            label: windows-x64
            rust-target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.label }}

      - name: Install npm dependencies
        run: npm ci

      # macOS: full pipeline — Tauri build + DMG post-patch that injects
      # 安装说明.txt and positions its icon below the background image hint.
      - name: Build & package (macOS)
        if: matrix.platform == 'macos-latest'
        run: npm run package

      # Windows: Tauri produces .msi (WiX) and/or .exe (NSIS) installers.
      - name: Build (Windows)
        if: matrix.platform == 'windows-latest'
        run: npm run tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AutoCapture-${{ matrix.label }}
          if-no-files-found: ignore
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app.tar.gz
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.zip
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip

      # On tag push (vX.Y.Z), attach the installers to a draft release so a
      # maintainer can review and publish.
      - name: Attach to draft release (tagged push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: AutoCapture ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
